name: Bug report
description: Report a reproducible OpenClasp defect
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private conversations, or personal data. Use the security policy for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, agent framework, and transport.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private conversations, and personal data.
          required: true
